[pytest]
# Task 0.5 introduces tests/owner_state/test_model.py, whose basename collides with the
# existing tests/engine/test_model.py. Under pytest's default "prepend" import mode the
# two compete for the module name `test_model` and collection fails outright. importlib
# mode gives each test file a unique fully-qualified module name, so the plan's declared
# filenames can stand as written without __init__.py files across tests/.
addopts = --import-mode=importlib

# importlib mode does not put a test file's own directory on sys.path, so the bare
# `from helpers import make_inputs, product` that the engine tests use (plan Task 1.0)
# would not resolve. Naming the directory here keeps that import working without
# adding a conftest.py or rewriting the plan's test files.
pythonpath = tests/engine

# `slow` marks a test that drives the real CLI over the pilot data — about a minute each,
# and the only cover the reproduction path has. They run by default and in CI, because a
# suite that excludes its slowest tests by default is a suite that stops running them.
# `npm run test:py:fast` skips them for local iteration.
markers =
    slow: drives the real engine over the pilot data (~1 min)
