# ci.yml — tests run before a merge, for the first time (design.md ADR-013).
name: ci

# A change that touches only documents runs nothing (2026-09-29): the account's Actions minutes
# were at 2,704 of 3,000 with three days left, and no test reads docs/, CLAUDE.md or .claude/
# (checked with git grep). A change that touches anything else still runs everything.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'CLAUDE.md', '.claude/**']
  pull_request:
    paths-ignore: ['docs/**', 'CLAUDE.md', '.claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # node-version-file, not a pinned string: .nvmrc is the one place the version
        # lives, so CI and a developer's machine cannot drift apart silently. Pinning '20'
        # here is what broke this workflow's second run — jsdom's undici needs >= 22.14 and
        # fails with "webidl.util.markAsUncloneable is not a function", which names neither
        # Node nor a version.
        with: { node-version-file: '.nvmrc', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Lint
        run: npm run lint
      - name: JS unit and component tests
        run: npx vitest run
      - name: Python tests
        run: python3 -m pytest tests -q
      - name: Build
        run: npm run build
      - name: Surface invariants against the committed artefact (Checkpoint 2)
        run: npm run check:surface
      - name: Bundle size (ADR-018 — the budget that decision rests on)
        run: npm run check:bundle
      # The e2e layer has never run here. The four pre-cut-over specs are all
      # test.skip'd, so until daily-surface.spec.js and motion-loading.spec.js
      # landed there was nothing to run; now the one screen the product exists to
      # produce is driven in a real browser, and a suite that only runs on
      # someone's laptop is a suite that rots.
      #
      # `--with-deps chrome` because playwright.config.js pins `channel: 'chrome'`
      # — the installed Google Chrome rather than a downloaded chromium, which is
      # what keeps a fresh checkout from fetching 150 MB. The runner has no Chrome
      # until this step puts one there.
      #
      # webServer builds and serves dist/, so this re-runs the build above. That
      # is a few seconds, and the alternative is testing a dev server that does
      # not have the chunk split the motion tests exist to check.
      - name: End-to-end (the owner's daily surface, in a browser)
        run: |
          npx playwright install --with-deps chrome
          npm run test:e2e
      - name: Artefact contract (schema validates the committed artefact when present)
        run: |
          if [ -f public/data/dashboard.json ]; then
            python3 -c "import json,sys; sys.path.insert(0,'.'); from src.engine.publish import validate_artefact; validate_artefact(json.load(open('public/data/dashboard.json'))); print('artefact valid')"
          else
            echo "no dashboard.json yet"
          fi
