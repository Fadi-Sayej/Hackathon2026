# Daily market snapshot — T1 / #46, Step 5.
#
# This is the whole point of T1. History depth cannot be bought with money or
# code, only with elapsed time, and the price-transparency server keeps ONLY the
# current day (verified 2026-08-11, #46 Step 1). Every day this does not run is a
# day of market history permanently lost — it cannot be backfilled by any amount
# of effort later.
#
# It runs here rather than on a laptop because a laptop sleeps. Confirmed from a
# runner before committing to it: FTPS returned 693 files and Wolt returned 200
# (see .github/workflows/connectivity-probe.yml).
#
# 03:00 Asia/Jerusalem = 00:00 UTC. Price files are published overnight;
# collecting during business hours catches half-written files.
name: collect daily market snapshot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override the snapshot date (YYYY-MM-DD). Leave blank for today.'
        required: false

# One collection at a time. Two concurrent runs writing the same day is exactly
# how a half-populated snapshot gets sealed as though it were complete.
concurrency:
  group: collect-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          # .nvmrc, for the same reason as ci.yml. This workflow survived Node 20 only
          # because check_signals_live.mjs imports nothing from node_modules; the moment it
          # does, it would fail the way ci.yml did.
          node-version-file: '.nvmrc'

      - run: pip install -r requirements.txt

      - name: Health check before collecting
        # Reports the state of the series BEFORE today's run touches it, so a
        # gap that opened while nobody was looking is visible in the log of the
        # very next run. `continue-on-error` because a hole in history is not a
        # reason to skip today's collection — today is the one day still
        # recoverable.
        continue-on-error: true
        run: python3 scripts/check_collection_health.py

      - name: Collect
        id: collect
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            bash scripts/collect_daily.sh --date "${{ inputs.date }}"
          else
            bash scripts/collect_daily.sh
          fi

      - name: Commit the snapshot
        # Runs even when collection was partial — a partial day is still history,
        # and the manifest records exactly what was and was not captured. Only a
        # wholly failed day has nothing to commit.
        if: always() && steps.collect.outcome != 'cancelled'
        run: |
          git config user.name  "smartshelf-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -f data/external/snapshots/ || true
          if git diff --cached --quiet; then
            echo "No new snapshot data to commit."
            exit 0
          fi
          DAY=$(date -u +%Y-%m-%d)
          git commit -q -m "snapshot: market data for ${DAY}"
          # Another run may have landed while we collected.
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      # ── Rebuild the product from the day we just collected ──────────────
      #
      # Until 2026-09-07 nothing ran the pipeline: collection committed snapshots
      # and stopped. public/data/operational.json therefore only changed when a
      # human remembered, which is how it sat a month stale while silently
      # shipping competitorSignals: 0 — the entire market half of the product
      # absent, with every run reporting success.
      #
      # Safe to automate only now: export_dashboard_data.py raises
      # EmptyExportError BEFORE writing, so a failed rebuild leaves the last good
      # dashboard on disk instead of replacing it with an empty one.
      - name: Rebuild silver POS from the committed exports
        # data/internal/ is gitignored, so a runner starts with no POS tables at all.
        # Both source files ARE committed; this importer turns yomyom-inventory.csv into
        # the products/inventory/margins parquet the engine's capabilities read.
        #
        # import_yomyom_sales.py is NOT called here any more: run_engine()'s own
        # sales_import step writes sales_monthly.parquet and sales_summary.parquet from
        # the same seven CSVs, which ARE committed under data/internal/raw_pos/yomyom/sales/
        # despite the data/** ignore. Calling it first was simply the same import twice.
        run: python3 scripts/import_yomyom_pos.py --input yomyom-inventory.csv

      # ── Why refresh_pipeline.py is no longer run here (2026-09-13) ──────────
      #
      # It cannot be repaired honestly. Its product_recommendations step required
      # silver_pos/yomyom_sales.parquet, and Task 0.6 deleted that table on purpose:
      # its units_sold_30d was synthesised from a monthly mean, which is exactly what
      # rule 13 forbids — the seven reports are MONTHLY and cover 24.3% of the
      # catalogue. Its companion column demand_per_day_corrected came from
      # build_velocity_from_snapshots.py, which this workflow has never run, so
      # corrected_monthly_demand() has always returned None on a runner.
      #
      # That leaves no honest repair. Rebuilding the table re-introduces the
      # synthesised figure Phase 0 removed; passing --allow-no-competitor to get a
      # green export is rule 10. So the legacy chain stops running instead of being
      # propped up.
      #
      # public/data/operational.json therefore freezes at its last good value, which is
      # the correct state for a rollback target (§20.2): after the cut-over no V1 page
      # imports loadOperationalData — only src/telemetry/ does — so nothing the owner
      # opens reads it. Phase 4 deletes the chain.
      #
      # sources.json is left frozen too, deliberately, and NOT added to the commit below
      # even though competitor_product_signals.py still rewrites it on every engine run.
      # Its two writers disagree about what a row is: the legacy exporter recorded
      # 17,165,316 alonit rows where the engine's own chain records 560,596 after dedup,
      # and 161,270 wolt rows against 7,414. Until someone decides which of those the
      # owner is being shown, committing either nightly would bake in a number nobody
      # can source (rule 11).
      - name: Run the engine and publish the artefact
        id: engine
        # The V1 engine, and now the only pipeline here. run_engine() drives its own
        # market chain (market_context, rehydrate_silver, competitor_signals,
        # product_matching) and its own sales import, and read nothing the refresh
        # pipeline produced. On 2026-09-13 the legacy recommender went readiness_only
        # and the gate that followed exited 1, so this step never ran and the owner's
        # artefact was never rebuilt — for a failure in a chain it does not use.
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: hackathon26-a6ebd
          VITE_STORE_ID: yomyom-kafr-qasim
        run: python3 scripts/run_engine.py --json-out /tmp/engine.json

      - name: Say plainly what the engine run was
        # ADR-017: a run that continued on older sales evidence is never 'ok'. This
        # does NOT fail the build — a late report is a normal day for an owner
        # emailing CSVs by hand — but it must be visible in the log rather than
        # discovered later from a stale window.
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/engine.json'))
          print(f"engine status: {d['status']}")
          for s in d['steps']:
              if s['status'] != 'ok':
                  print(f"::warning::step {s['step']} {s['status']} {s.get('error') or ''}")
          PY

      - name: Does each capability depend on what it declares?
        # The V1 equivalent, over the engine's artefact (Task 3.3). Withholds each
        # input at source and reads the published statuses, so a capability that
        # reads something it did not declare is caught. Five engine runs; nightly is
        # where it belongs, not on push.
        #
        # Blocking since the cut-over (Task 2.7), exactly as the earlier note here said
        # it would become. dashboard.json is now what the owner opens, so a probe
        # failure means the artefact is wrong — and committing a wrong artefact to his
        # live surface is worse than leaving him yesterday's. Both run in mode="print"
        # against tempdir copies, so neither can touch the file about to be committed.
        run: python3 scripts/check_v1_signals.py

      - name: Do detection and hygiene still fail independently?
        run: python3 scripts/check_independence.py

      - name: Are the deployed Firestore rules the ones in this repository?
        # The pilot's data isolation rests on two lines of firestore.rules: one store is
        # allowed, everything else denied. Vercel Preview and Production carry the same
        # VITE_FIREBASE_* values, so that deny branch is the only thing stopping a preview
        # of any branch from writing the owner's state — Preview's VITE_STORE_ID was set to
        # `preview-sandbox` on 2026-09-13 precisely so the catch-all refuses it.
        #
        # Nothing deploys those rules. `firebase deploy --only firestore:rules` is run by
        # hand, so the committed file and the live ruleset can drift silently, and a console
        # edit loosening the catch-all would make the isolation decorative with nothing to
        # say so. This reads the deployed ruleset text and diffs it.
        #
        # Read-only: no document is touched and no anonymous user is created. Exit 2 means
        # the credential or the API refused, which is a different sentence from drift, so it
        # is reported and does not fail the night.
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set +e
          python3 scripts/check_firestore_rules.py
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::Could not read the deployed Firestore rules; drift is unverified tonight."
            exit 0
          fi
          exit $code

      - name: Is every signal still reaching an output?
        # A run can succeed while a signal quietly stops applying — that has happened
        # four times in this project, each time with unit tests green. Reads
        # public/data/market-context.json, which run_engine() writes through its own
        # market_context step, so this still guards a file we are about to commit.
        run: node scripts/check_signals_live.mjs

      - name: Commit the owner's artefact
        # The step this workflow was missing. The engine published dashboard.json into
        # the runner's workspace every night and the job then threw it away: nothing here
        # ever added it to a commit. Before the cut-over that was invisible, because the
        # browser read operational.json. After it, the owner's screen could only ever show
        # whatever artefact a human last committed by hand — a nightly run that moves
        # nothing (rule 12).
        run: |
          git config user.name  "smartshelf-collector"
          git config user.email "collector@users.noreply.github.com"
          git add public/data/dashboard.json public/data/market-context.json
          if git diff --cached --quiet; then
            echo "Artefact unchanged."
            exit 0
          fi
          DAY=$(date -u +%Y-%m-%d)
          git commit -q -m "engine: artefact for ${DAY}"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Health check after collecting
        # Now it IS a gate. If the day we just collected is unusable — a short
        # run, an empty source, a failed manifest — the job goes red while the
        # server still holds today's file and a rerun can still save it.
        run: python3 scripts/check_collection_health.py --max-age-days 1

      - name: Fail loudly
        # A collector that dies silently in week 3 and is noticed in week 8 has
        # cost five weeks of irreplaceable history. This is the single most
        # likely way this track fails, so a failed day must be noisy: the run is
        # marked failed, which surfaces in the Actions UI and in GitHub's
        # notification email to the repo owner.
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Daily market collection FAILED. This day cannot be re-collected."
          echo "::error::Check the manifest in data/external/snapshots/ and rerun promptly."
          exit 1
