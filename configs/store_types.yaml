# store_types.yaml — store format (identity) reference data.
#
# WHY THIS FILE EXISTS
#   Without a store-format field the system compares a gas-station minimarket to a
#   25,000-SKU hypermarket and confidently recommends 5 kg rice bags to a forecourt
#   shop. One absurd recommendation costs the manager's trust in everything else.
#
# THIS IS REFERENCE DATA, NOT CODE.
#   Edit it by hand. `scripts/classify_store_types.py` may APPEND inferred entries,
#   but it never overwrites an entry whose `verified` is `manual`.
#
# Consumers:
#   - src/common/store_types.py        (Python API: affinity, comparable_stores)
#   - src/engine/inputs.py             (stamps each competitor observation's affinity)
#   - src/engine/competitor_position.py  (enforcement point: the comparability floor, ADR-008)

version: 1

# ── The scale ────────────────────────────────────────────────────────────────
# Ordered by assortment breadth. `typical_sku_range` is what the inference in
# Step 3 keys off, so the ranges must stay contiguous and non-overlapping.
formats:
  gas_convenience:
    label_en: "Forecourt convenience store"
    label_he: "חנות תחנת דלק"
    label_ar: "متجر محطة وقود"
    typical_sku_range: [300, 1500]
    note: "This is YomYom. Every affinity lookup starts from here."
  urban_minimarket:
    label_en: "Neighbourhood minimarket"
    label_he: "מינימרקט שכונתי"
    label_ar: "سوبرماركت حي صغير"
    typical_sku_range: [1501, 4000]
    note: "No fresh counter."
  midsize_grocery:
    label_en: "Mid-size grocery"
    label_he: "מכולת גדולה"
    label_ar: "بقالة متوسطة"
    typical_sku_range: [4001, 10000]
    note: "Full grocery, limited fresh."
  supermarket:
    label_en: "Supermarket"
    label_he: "סופרמרקט"
    label_ar: "سوبرماركت"
    typical_sku_range: [10001, 25000]
  hypermarket:
    label_en: "Hypermarket"
    label_he: "היפרמרקט"
    label_ar: "هايبرماركت"
    typical_sku_range: [25001, 1000000]
    note: "Big-box. Never a fair price comparison for a forecourt shop."

# ── Comparability ────────────────────────────────────────────────────────────
# Comparability is not binary. Read as: affinity[our_format][their_format].
#
#   1.0  same format — full strength
#   0.7  adjacent — fair comparison
#   0.3  distant — signal passes through at reduced strength (see min_affinity)
#   0.1  barely comparable — context only, never drives a recommendation
#   0.0  NEVER compare — the source is dropped before it reaches any engine
#
# `unknown` is deliberately 0.2: below `min_affinity`, so an unclassified source
# can never drive a recommendation, but not 0.0 — "we have not classified it yet"
# is a different statement from "this is not comparable".
affinity:
  gas_convenience:
    gas_convenience: 1.0
    urban_minimarket: 0.7
    midsize_grocery: 0.3
    supermarket: 0.1
    hypermarket: 0.0
    unknown: 0.2
  urban_minimarket:
    gas_convenience: 0.7
    urban_minimarket: 1.0
    midsize_grocery: 0.7
    supermarket: 0.3
    hypermarket: 0.1
    unknown: 0.2
  midsize_grocery:
    gas_convenience: 0.3
    urban_minimarket: 0.7
    midsize_grocery: 1.0
    supermarket: 0.7
    hypermarket: 0.3
    unknown: 0.2
  supermarket:
    gas_convenience: 0.1
    urban_minimarket: 0.3
    midsize_grocery: 0.7
    supermarket: 1.0
    hypermarket: 0.7
    unknown: 0.2
  hypermarket:
    gas_convenience: 0.0
    urban_minimarket: 0.1
    midsize_grocery: 0.3
    supermarket: 0.7
    hypermarket: 1.0
    unknown: 0.2
  unknown:
    gas_convenience: 0.2
    urban_minimarket: 0.2
    midsize_grocery: 0.2
    supermarket: 0.2
    hypermarket: 0.2
    unknown: 0.2

# Minimum affinity for a source to DRIVE a recommendation. Sources between 0.0
# (exclusive) and this value are kept as context — visible in the competitor
# panel, labelled as a different format — but excluded from the price a
# recommendation is built on.
min_affinity: 0.3

# ── The stores ───────────────────────────────────────────────────────────────
# `verified` — who decided:
#   manual   — a person decided. Authoritative; a script will never overwrite it.
#   proposed — a starting point awaiting a person. Treated as unverified.
#   inferred — a script derived it from a SKU count. Treated as unverified.
#
# `basis` — what the decision rests on. `verified: manual` says the call is final;
# `basis` says how much to trust it, and the two are not the same thing:
#   branch_known  — we know this specific branch first-hand.
#   chain_format  — the chain trades in one recognisable format and this branch is
#                   an ordinary instance of it. Reliable for the chains below, but
#                   it is desk knowledge, not a visit. A branch that is unusually
#                   large or small for its chain will be wrong here.
#   sku_count     — inferred from a full catalog's distinct SKU count.
#
# Store IDs reuse the identifiers that already exist:
#   - the four static ids below, first defined for the Kaggle chains (their importer and
#     exporter were removed on 2026-09-24; the ids stay in use by src/common/store_types.py)
#   - the Wolt platform `store_id` for delivery-catalog venues
stores:
  # -- our store, and the static chains ---------------------------------------
  yomyom-kq-01:
    store_type: gas_convenience
    role: client
    verified: manual
    basis: branch_known
    name: "YomYom Kafr Qasim"
    note: "Our store. The anchor of every affinity lookup."
  dor-alon-kq-01:
    store_type: gas_convenience
    verified: manual
    basis: branch_known
    name: "Alonit Kafr Qasim"
    note: "Forecourt shop 1.4 km away — the single most comparable source we have."
  rami-levy-pt-01:
    store_type: supermarket
    verified: manual
    basis: chain_format
    name: "Rami Levy Petah Tikva"
    note: >
      Rami Levy is Israel's price floor. Its shelf price is not a target a forecourt
      shop can chase — hence affinity 0.1: visible as context, never an instruction.
  shufersal-pt-01:
    store_type: hypermarket
    verified: manual
    basis: chain_format
    name: "Shufersal Deal Petah Tikva"
    note: "Deal is Shufersal's big-box format. Affinity 0.0 — never compared."

  # -- Wolt delivery-catalog venues -------------------------------------------
  # Set from each chain's trading format. NOT from the scrape: these hold 1–59
  # SKUs each, which is a sampling artefact and says nothing about the branch —
  # SKU inference is deliberately refused on them (see min_skus_for_inference).
  #
  # These IDs reached no screen through the legacy exporter, whose CHAIN_ALIASES folded
  # Wolt prices into the static store IDs above (removed 2026-09-24). They matter to
  # comparable_stores() and to the engine, which stamps each competitor observation with
  # its affinity (src/engine/inputs.py), so they are classified rather than left blank.
  65daeb8779ca7f0a9bf964f3:
    store_type: urban_minimarket
    verified: manual
    basis: chain_format
    name: "Wolt Market | Lev Haaretz"
    chain: "Wolt Market"
    note: "Wolt's own dark store — delivery-only assortment, no shelf, minimarket-sized."
  6315c7a3f00f9e43ec812476:
    store_type: urban_minimarket
    verified: manual
    basis: chain_format
    name: "Rami Levy In The Neighborhood"
    chain: "Rami Levy"
    note: >
      'In The Neighborhood' is Rami Levy's small urban format — a different
      business from the Petah Tikva supermarket, and much closer to ours.
  6576d161608e6c09be0c0e54:
    store_type: supermarket
    verified: manual
    basis: chain_format
    name: "King Store | Rosh Haayin"
    chain: "King Store"
    note: >
      King Store trades as a full discount supermarket. Called supermarket rather
      than midsize_grocery deliberately: those two differ by one affinity band
      (0.1 vs 0.3), and that band is the difference between context and an
      instruction. When torn between two formats, take the more distant one — a
      missing recommendation costs less than an absurd one.
  6475f16879b711f39a180292:
    store_type: supermarket
    verified: manual
    basis: chain_format
    name: "Shufersal | Rosh Ha'ayin"
    chain: "Shufersal"
    note: "Standard Shufersal branch, not a Deal box — supermarket, not hypermarket."
  689d9d1ea1357c9968d6850f:
    name: Super Alonit Einat (Wolt)
    store_type: gas_convenience
    verified: manual
    basis: branch_known
    notes: Dor Alon forecourt shop, the reference venue in delivery_targets.yaml; collected daily since 2026-08-11 but unclassified until 2026-09-08.
  68e64a15ddc7ae17b6279458:
    store_type: gas_convenience
    role: client
    verified: manual
    basis: branch_known
    name: "Yom Yom"
    chain: "Yom yom"
    note: "Our own venue on Wolt. Same shop, so by definition the same format."
  65af9c58e895c470fe3eb763:
    store_type: supermarket
    verified: manual
    basis: chain_format
    name: "Victory | Rosh Ha'ayin Park Afek"
    chain: "Victory"
  631480ca6741954d25cf2611:
    store_type: supermarket
    verified: manual
    basis: chain_format
    name: "Victory | Rosh Ha'ayin Shabazi"
    chain: "Victory"
  6846c439813000ebeb979157:
    store_type: unknown
    verified: manual
    basis: chain_format
    name: "Bingo"
    chain: "Bingo"
    note: >
      Decided — and the decision is that we do not know. The Wolt record carries no
      chain, one barcode, and a name that maps to no format I can identify.
      `unknown` scores 0.2: visible as context, never able to drive an action,
      which is the correct answer to a question we cannot answer. Guessing
      `urban_minimarket` here would be the exact failure this file exists to stop.

