# Demand-shaping windows — RECOMMENDED DEFAULTS, for the store owner to confirm.
#
# These are business decisions, not religious or astronomical facts. They say how
# far ahead of an event ordering should change, the way the Hebrew calendar
# (src/context/hebrew.py) gates on chametz_stop_reorder_days below rather than on
# Pesach itself. Every value here is a starting recommendation from the analysis,
# NOT a measured optimum: nothing in the data yet proves any of them, because a
# full Ramadan has not been observed with this pipeline running.
#
# Change a number here and the pipeline picks it up on the next run. No code edit.

islamic:
  # Ramadan reshapes the whole trading day: daytime food demand collapses, and
  # iftar/suhoor demand spikes. 21 days sits between Hebcal's 30-day stop-reorder
  # and 14-day clear-stock gates — one full supplier cycle plus slack, given that
  # real supplier lead times are still unmeasured (see docs/operations/receiving-ledger.md).
  ramadan_build_up_days: 21

  # Eid al-Fitr demand (sweets, gifts, holiday goods) peaks in the last third of
  # Ramadan, so the ramp starts inside the month rather than after it.
  eid_al_fitr_build_up_days: 10

  # Eid al-Adha is meat-centred and matters less to a convenience store, but the
  # run-up still lifts sweets and disposables.
  eid_al_adha_build_up_days: 10

  # Days after an Eid begins during which demand stays elevated.
  eid_tail_days: 3

jewish:
  # Read by src/context/hebrew.py, which falls back to these same values when this
  # file cannot be read. The browser's copy (src/lib/context/hebcal.js) was removed
  # on 2026-09-24 (ADR-028), so both calendars are tuned here and only here.
  chametz_stop_reorder_days: 30
  chametz_clear_stock_days: 14
  pesach_length_days: 8

competitor:
  # When the surrounding branches are out of something he sells, their customers
  # have nowhere else to buy it today — so his demand rises. This is a demand
  # ADJUSTMENT, never a gate: whether to reorder is decided from his own stock and
  # sales, and this only nudges the rate.
  #
  # 1.15 = 15% lift. A starting recommendation, not a measurement: no competitor
  # stockout has yet been observed alongside his till data to calibrate it. Only
  # statistically-classified STOCKOUT counts (src/market/concentration.py); a
  # DELISTING is the market walking away and must never lift anything.
  stockout_demand_lift: 1.15
