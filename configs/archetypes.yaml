# archetypes.yaml — product archetypes and their sensitivity vectors (issue #50).
#
# ── WHY THIS FILE IS THE STEP THAT MAKES 109 PARAMETERS FEASIBLE ────────────
#   Assigning 109 weights to each of 7,674 products means tuning 836,466 numbers.
#   Nobody can review that, and an LLM asked to invent them produces confident
#   nonsense.
#
#   Instead every product is assigned ONE archetype, and the archetype carries the
#   vector. ~40 archetypes x ~15 meaningful weights is about 600 numbers a human can
#   actually read and argue with.
#
#   It also reframes issue #51's job from "invent 109 floats" — which LLMs do badly —
#   into "pick one bucket from a closed list", which they do well.
#
# ── HOW TO READ A SENSITIVITY ───────────────────────────────────────────────
#   1.0  = unaffected. Omit it; the engine defaults every unlisted parameter to 1.0.
#   1.4  = demand rises 40% when the factor is fully present
#   0.6  = demand falls 40%
#   Only list what genuinely moves. A vector full of 1.05s is noise pretending to be
#   knowledge.
#
# ── WEIGHTS ARE ASSUMED UNTIL ISSUE #53 MEASURES THEM ───────────────────────
#   Every number here is an educated guess about a forecourt shop on a highway in
#   Kafr Qasim. Issue #53 decomposes seven months of our own sales and replaces these
#   with measured effects carrying confidence intervals. Until then `confidence:
#   assumed` is on every archetype, and no manager-facing text may present these as
#   measured facts.
#
# ── GATES ARE NOT SET HERE ──────────────────────────────────────────────────
#   An archetype may declare `flags`, and gates in market_params.yaml key off those
#   flags. But a gate only fires when the PRODUCT's own profile has the flag AND has
#   been reviewed by a human (`reviewed_by` non-null). An archetype can never by
#   itself block a product from sale.

version: 1

defaults:
  confidence: assumed
  store_fit: gas_convenience

