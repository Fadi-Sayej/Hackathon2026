  # neutral vector: it never boosts, never suppresses, and never fires a gate.
  # An unclassified product must behave as though we know nothing about it, because
  # we do not.
  unclassified:
    label_ar: "غير مصنّف"
    flags: {}
    sensitivities: {}
    confidence: none
