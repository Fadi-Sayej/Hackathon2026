#   units would measure how busy the shop was rather than what the customer
#   chose.
#
# HOW MUCH TO TRUST IT
#   Every entry carries `n_obs` and `confidence`. There are SEVEN monthly
#   observations in total and calendar windows straddle month boundaries, so
#   no entry here can be better than `medium`. #50 must weight these by how
#   well measured they are; an effect from 7 points should not override a
#   hand-set default with the same authority as one from 300.
#
# WHAT IS DELIBERATELY ABSENT
#   Weekday and payday cycles: not measurable. The reports carry no date
#   column, so there is no day-of-week signal to find. Keep the existing
#   defaults in #50 and treat them as documented guesses.
#   Effects whose confidence interval spans 1.0 are omitted rather than
#   published at their point estimate.
#   Effects that vanish once a linear time trend is controlled for are
#   omitted as `confounded`. The seven months run Jan-Jul and Ramadan
#   falls in months 2-3, so calendar exposure is nearly collinear with
#   seasonal drift. Beverages looked like a x0.82 Ramadan suppression and
#   were simply rising into summer.
#
# ⚠️ The calendar windows in configs/calendars.yaml are NOT YET VERIFIED.
