# configs/policy.yaml — every declared constant in one place (design.md §10.4).
# Published verbatim into dashboard.json → meta.thresholds. Change a value here,
# never in code. Provisional values are marked with the open question they await.
version: 1

# SPEC-003 — declared, never derived (FR-045, FR-045b, FR-043a)
price_policy_pct: 60          # owner's stated maximum premium over the balanced reference
attention_pct: 100            # same-day attention above this premium
cost_floor_pct: 10            # reference must exceed our cost by this margin
freshness_days: 14            # OQ-306 provisional: observations older than this drive nothing

# D-4 data-entry artefacts (SPEC-001 FR-010)
artefact_min_price: 0.5
artefact_cost_ratio: 2
max_credible_gap_pct: 300     # the old credibility.js guard (deleted 2026-09-27), kept as a COUNTED exclusion (design §22.2)

# SPEC-006
surface:
  bound: 10
  unvalued_places: 3          # OQ-602 provisional
  # OQ-601 provisional. Hygiene ranks last on purpose: 1,155 records of finite one-time
  # cleanup would otherwise hold the three reserved places for weeks (design §9.2).
  # F9-S1 FR-171: the assortment gap is first, and capped at one place below, so it shows a
  # finding every day without displacing reconciliation's other two.
  unvalued_order: [assortment_gap, reconciliation, competitor_position, catalogue_lifecycle, hygiene]
  unvalued_caps: {assortment_gap: 1}
  # F6-S1 FR-106a: every unvalued capability keeps the order the engine published, its own
  # stated key: F9's (F9-S1 FR-172), the biggest gap ratio first (F2-S1 FR-024, "the biggest
  # first", the repository owner 2026-09-29), the highest premium, the one quantity question
  # and then the highest unit cost (F4-S1 FR-069), and hygiene's own order.
  engine_ordered: [assortment_gap, reconciliation, competitor_position, catalogue_lifecycle, hygiene]
  # D-26: the places left after F9's take turns. One place per kind per round, and the order of
  # these kinds shifts by one each day of the nightly's date, so each is on Today two days in four.
  rotate: [reconciliation, competitor_position, catalogue_lifecycle, hygiene]

# SPEC-005 D-8
question_limit: 3

# ARCH-GATE-002 provisional — the basis for "money at stake" on a cost question.
# FR-085 orders questions by money x yield and never defines the money. This names what the
# engine computes so the figure can state its own basis and a change is a policy edit, not a
# silent code change. The alternatives, should the owner disagree: margin_at_risk (needs the
# cost we are asking for — circular), or units_only (drops price entirely).
# C-41's existing behaviour does NOT transfer: it ranked by a per-product loss that only exists
# once a cost is known, which is precisely what is missing here.
question_money_basis: window_revenue_at_shelf_price   # units sold in the window x current shelf price
question_yield_factor: 1.0    # an answer is assumed to unlock the whole amount until the pilot says otherwise

# ARCH-GATE-004 provisional — what makes a product structurally uncomparable (SPEC-003 FR-052).
# A barcode shorter than this is an internal code or a service (car wash, barista coffee), not a
# retail identifier, so no other shop can carry it and its absence from the comparison is a fact
# about the catalogue rather than a gap in our data. 1,628 of the 7,674 items are such records.
uncomparable_min_barcode_digits: 8

# SPEC-001 FR-004 ceiling derivation (reproduces 18% on the pilot distribution)
ceiling_derivation:
  band_pct: 2
  drop_ratio: 0.75
  min_band_count: 20

# SPEC-004
implausible_revenue_share: 0.10   # OQ-405 provisional
full_annual_cycle_months: 12      # OQ-408 provisional
withdraw_with_stock: false        # OQ-409 — must stay false; the loader refuses true

# ── Which catalogue the published artefact counts over (ADR-020) ──────────────
# GAP-009 is open: automatic withdrawal rests on "absent from the monthly reports"
# meaning "sold nothing", which the owner has not confirmed — it is true of 3,932 of
# 3,932 withdrawable products, and exactly one product in the catalogue appears in the
# reports with an observed zero. Until he confirms it, D-14 forbids showing him a figure
# that depends on it, so the artefact counts over the WHOLE catalogue.
#
# When GAP-009 closes, change this to `living`. Nothing else changes.
published_population: whole

# ── The owner's own ceiling, if he has stated one (GAP-011) ───────────────────
# derive_ceiling reads 18% from his behaviour: 81 products in the 16-18% band collapsing
# to 7 in 18-20%. That is strong evidence of where his pricing stops. It is NOT a statement
# that he believes his ceiling is 18% — and F1's whole correction rests on the difference,
# because 1,124 products are kept silent for being inside "his sound policy".
#
# null  = use the derived ceiling, and say it was derived.
# a number = he stated it; use his, and say it was his.
#
# Setting this does not delete the derivation: both travel with the figure, so a divergence
# between what he says and what he does stays visible. That divergence is more useful than
# either number alone.
owner_declared_ceiling_pct: null

# ── F8-S1: order quantity (V2, Phase 5) ───────────────────────────────────────
# Every key below is required: the loader supplies no default for any of them, because a
# defaulted value would be published exactly like a declared one.

# F8-S1 FR-144 / FR-149. OQ-906 provisional: the evidence window, how many report days it
# must hold, how old its last day may be, and how old a stock count may be and still count.
order:
  window_days: 28
  min_report_days: 21
  freshness_days: 7
  max_count_age_days: 7
  # ADR-034. A disagreement is asked once and never again (D-20). On since Task 5.14 gave it
  # its own rendering in the Today panel, as the repository owner approved it on 2026-09-27.
  publish_disagreement_questions: true

# ADR-031, provisional until calibrated on the first month of per-day sales: a product is
# running out at a store when it was listed on min_listed of the prior_days usable days and
# has then been absent for min_absent to max_absent. A store-day where more than
# catalogue_change_pct of its steady listings vanish, or its listed count is under
# thin_collection_ratio of its median, is excluded. The signal is unavailable with fewer
# than signal_min_usable usable days in the last 14, or a latest one older than
# signal_max_age_days.
running_out:
  prior_days: 14
  min_listed: 10
  min_absent: 2
  max_absent: 7
  catalogue_change_pct: 10
  thin_collection_ratio: 0.5
  signal_min_usable: 10
  signal_max_age_days: 2

# ADR-032. The model is pinned (the repository owner's choice, 2026-09-26). max_pct is
# D-21's limit and the loader refuses more; request_ceiling is provisional.
boost:
  model: claude-sonnet-5
  max_pct: 25
  request_ceiling: 200
  prompt: configs/prompts/market_boost.v2.md   # v1 named the pilot's town and market size (ADR-036)

# F9-S1 §5, "recent": the usable nights among the last window_days calendar days. ADR-031's
# own fortnight: the span its signal must cover, and the history that makes a listing steady.
assortment_gap:
  window_days: 14

# F12-S1 FR-185: how much each further facing of a product counts for. Provisional values,
# approved by the repository owner on 2026-10-04 with the Phase 8 plan (OQ-1204).
shelf:
  # Eisend 2014's mean over 1,268 estimates (F12-S1 §23), until the store's own value meets
  # FR-206's three conditions.
  elasticity: 0.17
  # A judgement: at 0.17 a 5th facing adds under 4% to a product's sales. His "at least N"
  # rule overrides it.
  facings_cap: 4
  # D-38 (ADR-044, F12-S1 FR-233): room between a product's top and the shelf above, to take it
  # out. Approved 2026-10-08 with OQ-1213 as a starting value.
  height_clearance_mm: 20
  # F12-S1 FR-205, FR-209: measuring what an arrangement changed (OQ-1207, approved 2026-10-04
  # with the Phase 8 plan). The windows are F8's own, read from order.window_days and
  # order.min_report_days, never copied here.
  interval_level: 0.95          # the level the repository's other intervals use (z = 1.96)
  min_arrangements: 8           # a judgement, counted on distinct fixtures (the bootstrap's clusters)
  min_products: 40              # a judgement: about five arranged products an arrangement
  bootstrap_draws: 1000
  bootstrap_seed: 20261004      # fixed, so print mode and npm run figures reproduce the interval
  # F12-S1 FR-210 … FR-215: the AI's explanation of each fixture's plan (D-32; approved with
  # OQ-1209 on 2026-10-04, ADR-039). Provisional. The model is the boost's (boost.model).
  explanation_prompt: configs/prompts/shelf_explanation.v1.md
  explanation_request_ceiling: 40   # a night, counted across the night's runs
  explanation_time_budget_s: 300    # checked before each request; the step ends within ~300 + 61 s
  explanation_max_chars: 600        # a language
  explanation_max_tokens: 1200      # three languages; the boost's 300 would cut them off
  # F12-S1 FR-218 … FR-223 (D-34, D-35; ADR-041): the shelf reader, run when photos arrive, in the
  # nightly or on demand (ADR-042). OQ-1211's values, approved 2026-10-05 as provisional. The
  # model is the boost's.
  reader_prompt: configs/prompts/shelf_reader.v2.md   # v2 (D-36): the package where there is no tag
  reader_candidate_window_days: 90  # products sold in this window are the only ones a tag can name
  reader_tolerance_mm: 5            # D-34: the owner's ±5 mm per product
  reader_acceptance_min: 20         # hand readings, every one within the tolerance, before widths are used
  reader_request_ceiling: 60        # a reading
  reader_time_budget_s: 600         # a reading; checked before each request
  reader_timeout_s: 120             # one request with a dozen images takes longer than a text one
  reader_max_tokens: 4000           # a unit's shelves, runs and tags as JSON
