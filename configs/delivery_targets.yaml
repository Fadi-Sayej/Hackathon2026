# delivery_targets.yaml — verified Wolt venue URLs for SmartShelf.
#
# YomYom is the CLIENT market (the store we're optimising).
# All others are COMPETITORS within ~5km of YomYom (Kafr Qasim / Rosh Ha'ayin
# corridor). The radius was sourced via Wolt's /v1/pages/retail discovery
# endpoint and filtered with haversine distance from YomYom's coordinates
# (lat 32.1091501, lon 34.9624392).
#
# Why Wolt only?
# --------------
# The 10bis menu API is gated behind a personal user login (its bundle marks
# `getRestaurantMenu` as `isAuthRequired:!0`). Automating that login would
# (a) violate the 10bis Terms of Service and (b) require ongoing token /
# OTP maintenance. Conveniently, King Store and Shufersal are BOTH on Wolt,
# so we don't need 10bis at all.
#
# The Wolt URLs use the petah-tikva geographic slug because Wolt routes
# the Kafr Qasim / Rosh Ha'ayin sector through that city slug.
#
# Loaded by: scripts/run_delivery_to_firestore.py

targets:

  # ── CLIENT ──────────────────────────────────────────────────────────────
  - key: yomyom_kafr_qasim
    chain: yomyom
    chain_display: "YomYom"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/yom-yom
    city: "Kafr Qasim"
    role: client
    enabled: true

  # ── COMPETITORS (sorted by distance from YomYom) ────────────────────────

  - key: victory_park_afek           # 0.21km — closest direct supermarket
    chain: victory
    chain_display: "Victory"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/victory-rosh-haayin-park-afek
    city: "Rosh Ha'ayin"
    role: competitor
    enabled: true

  - key: wolt_market_lev_haaretz     # 0.60km — Wolt's own grocery brand
    chain: wolt_market
    chain_display: "Wolt Market"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/wolt-market-lev-haaretz
    city: "Kafr Qasim"
    role: competitor
    enabled: true

  - key: bingo_rosh_haayin           # 0.86km — local convenience grocery
    chain: bingo
    chain_display: "Bingo"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/bingo1
    city: "Rosh Ha'ayin"
    role: competitor
    enabled: true

  - key: king_store_kafr_qasim       # 1.25km — was on 10bis; address is KQ
    chain: king_store
    chain_display: "King Store"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/king-store-rosh-haayin
    city: "Kafr Qasim"
    role: competitor
    enabled: true

  - key: rami_levy_rosh_haayin       # 2.28km — major discount chain
    chain: rami_levy
    chain_display: "Rami Levy"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/rami-levy-in-the-neighborhood-rosh-haayin
    city: "Rosh Ha'ayin"
    role: competitor
    enabled: true

  - key: victory_shabazi             # 2.32km — second Victory branch
    chain: victory
    chain_display: "Victory"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/victory-rosh-haayin
    city: "Rosh Ha'ayin"
    role: competitor
    enabled: true

  - key: shuk_bair_rosh_haayin       # 2.53km — fresh produce market
    chain: shuk_bair
    chain_display: "Shuk Bair"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/shuk-bair-rosh-haain
    city: "Rosh Ha'ayin"
    role: competitor
    enabled: true

  - key: shufersal_rosh_haayin       # 2.76km — was on 10bis; available on Wolt
    chain: shufersal
    chain_display: "Shufersal"
    provider: wolt
    url: https://wolt.com/en/isr/petah-tikva/venue/shufersal-rosh-haayin
    city: "Rosh Ha'ayin"
    role: competitor
    enabled: true
